[package]
name = "remc-spectral"
version = "0.1.0"
edition = "2021"
description = "Bayesian spectral deconvolution with the exchange (replica-exchange) Monte Carlo method"
readme = "README.md"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# `cargo test` でも最適化を効かせる（MCMC は未最適化だと数十倍遅い）
[profile.test]
opt-level = 3
